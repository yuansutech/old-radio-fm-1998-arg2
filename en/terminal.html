<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">terminal.html —— Night Ferry system terminal</div>
    </div>
    <div class="window-body">
      <div class="terminal" id="term">
        <div class="line">Night Ferry · Terminal v1.0</div>
        <div class="line">Owner: Lu Chen</div>
        <div class="line">Type <span class="ok">help</span> to see available commands.</div>
        <div class="line">&nbsp;</div>
      </div>
      <div style="display:flex;align-items:center;margin-top:12px;">
        <span style="color:#ffb300;margin-right:8px;font-family:'Courier New',monospace;">&gt;</span>
        <input type="text" id="term-input" style="flex:1;background:#0a0a0a;border:1px solid #38302a;color:#ffb300;padding:8px 12px;border-radius:4px;outline:none;font-family:'Courier New',monospace;" autocomplete="off" autofocus>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
const term = document.getElementById('term');
const input = document.getElementById('term-input');
function print(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.innerHTML = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}
const COMMANDS = {
  help: () => {
    print('Available commands:');
    print('  ls              List files');
    print('  cat [file]      View file contents');
    print('  unlock [pwd]    Unlock protected files');
    print('  clear           Clear the screen');
    print('  exit            Exit');
  },
  ls: () => {
    print('home.html   about.html   schedule.html   host.html');
    print('letters.html   broadcast-01.mp3   broadcast-02.mp3');
    print('news.html   missing.html');
    print('<span class="ok">final.txt</span>  [Protected]');
  },
  'cat final.txt': () => print('The file is protected. Use the unlock command first.', 'err'),
  'cat final': () => print('The file is protected. Use the unlock command first.', 'err'),
  unlock: () => print('Usage: unlock [4-digit password]'),
  clear: () => { term.innerHTML = ''; },
  exit: () => { location.href = 'index.html'; }
};
function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  print('&gt; ' + raw);
  if (cmd === 'unlock 9870' || cmd === 'unlock9870') {
    setState({ finalUnlocked: true });
    saveNote('🔓 Terminal unlock successful! final.txt decrypted');
    print('<span class="ok">Password correct. final.txt has been decrypted.</span>');
    print('You can now access final.html.');
    print('Go back to the <a href="index.html" style="color:#7ee0ff;">radio home</a> to check.');
    return;
  }
  if (cmd.startsWith('unlock ')) { print('Wrong password.', 'err'); return; }
  if (COMMANDS[cmd]) { COMMANDS[cmd](); return; }
  print('Unknown command: ' + raw, 'err');
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = input.value;
    input.value = '';
    handleCommand(v);
  }
});
document.addEventListener('DOMContentLoaded', () => {
  if (!getState().terminalUnlocked) {
    document.querySelector('.window-body').innerHTML = `
      <div class="terminal">
        <div class="line err">Access denied. The terminal requires a password.</div>
        <div class="line">Hint: It's four digits. You've seen it somewhere else.</div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <input type="text" id="term-pwd" class="puzzle-input" maxlength="4" placeholder="····">
        <button class="btn primary" style="margin-left:8px;" onclick="checkTermPwd()">Unlock</button>
      </div>
    `;
  }
});
function checkTermPwd() {
  const v = document.getElementById('term-pwd').value.trim();
  if (v === '9870') {
    setState({ terminalUnlocked: true });
    saveNote('🔓 Terminal unlocked, password: 9870 (frequency)');
    location.reload();
  } else {
    alert('Wrong password.');
  }
}
</script>
</body>
</html>
