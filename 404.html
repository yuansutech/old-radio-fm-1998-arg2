<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - Yuansu</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            color: #333;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 50px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 72px;
            margin: 0;
            color: #00a862; /* 类似360的绿色，可改成你的主题色 */
        }
        h2 {
            font-size: 24px;
            margin: 10px 0 20px;
            font-weight: normal;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #00a862;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #008a50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404 - 报错</h1>
        <h2>您访问的页面不存在或已删除</h2>
        <p>您可以尝试返回首页，或者检查网址是否输入正确。</p>
        <a href="/" class="btn">返回首页</a>
    </div>
</body>
</html>
