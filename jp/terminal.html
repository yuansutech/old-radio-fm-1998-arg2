<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ターミナル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">terminal.html —— 夜航船システムターミナル</div>
    </div>
    <div class="window-body">
      <div class="terminal" id="term">
        <div class="line">夜航船 · ターミナル v1.0</div>
        <div class="line">所有者：陸沈</div>
        <div class="line"><span class="ok">help</span>と入力するとコマンド一覧を表示します。</div>
        <div class="line">&nbsp;</div>
      </div>
      <div style="display:flex;align-items:center;margin-top:12px;">
        <span style="color:#ffb300;margin-right:8px;font-family:'Courier New',monospace;">&gt;</span>
        <input type="text" id="term-input" style="flex:1;background:#0a0a0a;border:1px solid #38302a;color:#ffb300;padding:8px 12px;border-radius:4px;outline:none;font-family:'Courier New',monospace;" autocomplete="off" autofocus>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
const term = document.getElementById('term');
const input = document.getElementById('term-input');
function print(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.innerHTML = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}
const COMMANDS = {
  help: () => {
    print('使用可能なコマンド：');
    print('  ls              ファイル一覧');
    print('  cat [file]      ファイル内容を表示');
    print('  unlock [pwd]    保護ファイルを解除');
    print('  clear           画面をクリア');
    print('  exit            終了');
  },
  ls: () => {
    print('home.html   about.html   schedule.html   host.html');
    print('letters.html   broadcast-01.mp3   broadcast-02.mp3');
    print('news.html   missing.html');
    print('<span class="ok">final.txt</span>  [保護]');
  },
  'cat final.txt': () => print('ファイルは保護されています。先にunlockコマンドを使ってください。', 'err'),
  'cat final': () => print('ファイルは保護されています。先にunlockコマンドを使ってください。', 'err'),
  unlock: () => print('使用法：unlock [4桁のパスワード]'),
  clear: () => { term.innerHTML = ''; },
  exit: () => { location.href = 'index.html'; }
};
function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  print('&gt; ' + raw);
  if (cmd === 'unlock 9870' || cmd === 'unlock9870') {
    setState({ finalUnlocked: true });
    saveNote('🔓 ターミナル解除成功！final.txtを復号');
    print('<span class="ok">パスワード正解。final.txtを復号しました。</span>');
    print('これでfinal.htmlにアクセスできます。');
    print('<a href="index.html" style="color:#7ee0ff;">ラジオのホーム</a>へ戻って確認してください。');
    return;
  }
  if (cmd.startsWith('unlock ')) { print('パスワードが違います。', 'err'); return; }
  if (COMMANDS[cmd]) { COMMANDS[cmd](); return; }
  print('不明なコマンド：' + raw, 'err');
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = input.value;
    input.value = '';
    handleCommand(v);
  }
});
document.addEventListener('DOMContentLoaded', () => {
  if (!getState().terminalUnlocked) {
    document.querySelector('.window-body').innerHTML = `
      <div class="terminal">
        <div class="line err">アクセス拒否。ターミナルにはパスワードが必要です。</div>
        <div class="line">ヒント：4桁の数字です。別の場所で見たはずです。</div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <input type="text" id="term-pwd" class="puzzle-input" maxlength="4" placeholder="····">
        <button class="btn primary" style="margin-left:8px;" onclick="checkTermPwd()">解除</button>
      </div>
    `;
  }
});
function checkTermPwd() {
  const v = document.getElementById('term-pwd').value.trim();
  if (v === '9870') {
    setState({ terminalUnlocked: true });
    saveNote('🔓 ターミナル解除、パスワード：9870（周波数）');
    location.reload();
  } else {
    alert('パスワードが違います。');
  }
}
</script>
</body>
</html>
