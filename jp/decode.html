<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>復号ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">decode.html —— 陸沈の復号ツール</div>
    </div>
    <div class="window-body">
      <p class="dim">見つけた数字の断片を入力してください。すべて正しいと、組み合わせたパスワードが表示されます。</p>
      <div style="margin:20px 0;">
        <label class="dim" style="display:block;margin-bottom:6px;">断片1（手紙 · 初回放送日）：</label>
        <input type="text" id="f1" class="puzzle-input" maxlength="4" placeholder="····">
      </div>
      <div style="margin:20px 0;">
        <label class="dim" style="display:block;margin-bottom:6px;">断片2（パーソナリティ · 周波数）：</label>
        <input type="text" id="f2" class="puzzle-input" maxlength="4" placeholder="····">
      </div>
      <div style="margin:20px 0;">
        <label class="dim" style="display:block;margin-bottom:6px;">断片3（ファイル · 失踪日）：</label>
        <input type="text" id="f3" class="puzzle-input" maxlength="4" placeholder="····">
      </div>
      <button class="btn primary" onclick="tryDecode()" style="margin-top:16px;">復号を試す</button>
      <p id="decode-result" style="margin-top:16px;"></p>
      <div class="timetower" style="margin-top:24px;">
        <strong>💡 ヒント</strong><br>
        3つの断片はそれぞれ4桁の数字です。すべて正しいと完全なパスワードが表示されます。
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
function tryDecode() {
  const f1 = document.getElementById('f1').value.trim();
  const f2 = document.getElementById('f2').value.trim();
  const f3 = document.getElementById('f3').value.trim();
  const r = document.getElementById('decode-result');
  if (f1 === '0214' && f2 === '9870' && f3 === '0317') {
    r.innerHTML = '<span style="color:#7ee0ff;">✅ 復号成功。完全なキー：<strong>0214-9870-0317</strong></span>';
    saveNote('🔓 復号成功：0214-9870-0317');
  } else {
    r.innerHTML = '<span style="color:#ff5f57;">❌ 断片が一致しません。各数字を確認してください。</span>';
  }
}
</script>
</body>
</html>
