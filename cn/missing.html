<body>
<div class="drive">

    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>

    <div class="window-body">
      <p><strong>姓名：</strong>苏晚</p>
      <p><strong>性别：</strong>女</p>

      <div class="timetower">
        <strong>🔑 档案编号</strong><br>
        QC1998-0317<br>

        <span class="hl">3 月 17 日 → 0317</span>

      <div class="searchbar">
        <input type="text" placeholder="搜索…" autocomplete="off">
        <button>搜索</button>
      </div>
